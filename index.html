<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numera - Professional Numerology</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      @page {
        margin: 0;
      }
      body {
        font-family: "Poppins", sans-serif;
        background-color: #fcfcfc;
        color: #374151;
      }
      .font-serif {
        font-family: "Playfair+Display", serif;
      }

      @media print {
        /* hide non-print UI */
        .no-print {
          display: none !important;
        }

        /* show only printable root to avoid duplicate/empty pages */
        body * {
          visibility: hidden !important;
        }
        .printable-root,
        .printable-root * {
          visibility: visible !important;
        }
        .printable-root {
          position: absolute !important;
          left: 0;
          top: 0;
          width: 100% !important;
        }

        /* keep page break after each page, allow content to flow to next pages */
        .page-break {
          page-break-after: always !important;
          break-after: page !important;
          margin-bottom: 0 !important;
          box-shadow: none !important;
          /* Allow content to flow across pages instead of hiding overflow */
          overflow: visible !important;
          display: block !important;
          box-sizing: border-box !important;
          height: auto !important;
          min-height: 0 !important;
          /* Prevent content inside from being cut off at page boundaries */
          break-inside: auto !important;
          /* Add small top padding on every page */
          padding-top: 48px !important;
        }

        /* Force A4 size pages for print */
        @page {
          size: A4 portrait;
          margin: 0;
        }

        .report-container {
          width: 210mm !important;
          margin: 0 auto !important;
        }

        /* Ensure inner content uses box-sizing so padding doesn't expand page */
        .page-break * {
          box-sizing: border-box !important;
        }

        /* Prevent accent note and footer sections from breaking across pages */
        footer {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }

        /* Keep headers and large blocks together on same page */
        header {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
          break-after: avoid !important;
        }

        /* Allow paragraphs to break but avoid breaking small sections */
        main > div {
          break-inside: auto !important;
        }

        /* Prevent ALL direct children of page-break from splitting across pages */
        .page-break > * {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }

        /* Ensure paragraphs and text blocks stay intact */
        p {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }
        html,
        body {
          margin: 0 !important;
          padding: 0 !important;
        }
        body {
          background: white !important;
        }
        .report-container {
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
          max-width: none !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
          "react/": "https://esm.sh/react@^19.2.4/",
          "react": "https://esm.sh/react@^19.2.4",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
